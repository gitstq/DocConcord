name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (editable, no third-party runtime deps)
        run: python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Self-audit multilingual documentation (parity gate)
        run: python -m docconcord check . --format junit --output docconcord.xml --fail-on error

      - name: Verify JSON report is deterministic
        run: python -c "import json,subprocess,sys; a=subprocess.check_output([sys.executable,'-m','docconcord','check','.','--format','json']); b=subprocess.check_output([sys.executable,'-m','docconcord','check','.','--format','json']); assert a==b, 'non-deterministic output'; json.loads(a); print('deterministic JSON OK')"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docconcord-${{ matrix.os }}-py${{ matrix.python }}
          path: docconcord.xml
          if-no-files-found: ignore
